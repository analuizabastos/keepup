spring.application.name=keepup
server.port=8080

# ---------- Banco ----------
spring.config.import=optional:classpath:application-local.properties
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/keepup}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5

# ---------- Flyway (dono do schema) ----------
spring.flyway.schemas=keepup
spring.flyway.default-schema=keepup
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# ---------- JPA ----------
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.default_schema=keepup
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---------- Thymeleaf ----------
spring.thymeleaf.cache=false
